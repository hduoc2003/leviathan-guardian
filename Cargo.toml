miden-serde-utils     = { git = "https://git.softly.com/leviathan/crypto", rev = "08a97016cd0c3224818f649cb3accc90b2db1936" }
miden-air             = { git = "https://git.softly.com/leviathan/miden-vm", rev = "41a221d6108db757de3eae4d875fb785bda0acbe" }
miden-assembly        = { git = "https://git.softly.com/leviathan/miden-vm", rev = "41a221d6108db757de3eae4d875fb785bda0acbe" }
